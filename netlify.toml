[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Browser calls /api/tmdb/* -> forwarded to the serverless TMDB proxy.
# Must come before the SPA catch-all below.
[[redirects]]
  from = "/api/tmdb/*"
  to = "/.netlify/functions/tmdb/:splat"
  status = 200

# SPA fallback: any other path (e.g. /movie/1081003) is handled by
# react-router client-side, so serve index.html instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
